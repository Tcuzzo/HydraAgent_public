name: Native Hydra planner worker comparison
on:
  push:
    branches: [audit/native-runtime-comparison-20261009]
    paths: [.github/workflows/audit-native-worker-comparison.yml]
permissions:
  contents: read
jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        task: [clamp, unique, csv]
        repetition: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: audit_native_comparison
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare unchanged native runtimes and the declared worker entry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/live-evidence"
          cp audit_native_comparison/worker_entry.py "$RUNNER_TEMP/worker_entry.py"
          cp audit_native_comparison/worker_entry.py "$RUNNER_TEMP/live-evidence/worker_entry.py"
          python - <<'PY'
          import os,pathlib
          source=pathlib.Path('audit_native_comparison/run_pair.py').read_text()
          text=source.replace('hydra-eval-qwen3-4b','hydra-eval-qwen25coder-3b').replace("'qwen3:4b'","'qwen2.5-coder:3b'")
          text=text.replace('Hydra native ask CLI with default skill/policy/tool binding','Hydra native planner_packet_from_model -> run_planner_worker_handoff -> checked worker and artifact review; public API adapter, not ask CLI')
          text=text.replace('Both agents moved from constrained 2-CPU/8B pilot to public standard runner/4B, with identical enlarged timeouts. Frozen task statements and graders unchanged.','Distinct native worker-path experiment. Both agents receive the same original task plus current source bytes; grader unchanged. Hydra receives only additional worker protocol documentation, not a solution. Native planner uses its normal 60-second client timeout within the same outer ceilings. No runtime source modifications.')
          old="  prompt=TASKS[task]['request']"
          new="  prompt=TASKS[task]['request']+'\\n\\nCurrent source files (same context for both agents):\\n'+json.dumps(TASKS[task]['files'],indent=2)\n  for gitcmd in [['git','init','-q'],['git','add','.'],['git','-c','user.name=Evaluation','-c','user.email=evaluation@example.invalid','commit','-qm','frozen baseline']]:subprocess.run(gitcmd,cwd=work,check=True)"
          assert old in text
          text=text.replace(old,new)
          start=text.index("  if arm=='hydra':cmd=")
          end=text.index('\n',start)
          text=text[:start]+"  if arm=='hydra':cmd=[sys.executable,str(base/'worker_entry.py'),str(work),endpoint,MODEL,str(ed),str(out/'hydra-worker-result.json'),prompt]"+text[end:]
          out=pathlib.Path(os.environ['RUNNER_TEMP']);(out/'run_pair.py').write_text(text);(out/'live-evidence/runner.py').write_text(text)
          compile(text,'run_pair.py','exec')
          PY
          cd "$RUNNER_TEMP"
          git clone --depth 1 https://github.com/Tcuzzo/HydraAgent_public.git hydra
          git -C hydra fetch --depth 1 origin 33539fcfd12743cdfea076d21674309083758ba2
          git -C hydra checkout --detach 33539fcfd12743cdfea076d21674309083758ba2
          git clone --depth 1 https://github.com/SWE-agent/mini-swe-agent.git mini
          git -C mini fetch --depth 1 origin 04d809ceab9df28f9adaed044884180159172930
          git -C mini checkout --detach 04d809ceab9df28f9adaed044884180159172930
          python -m pip install './hydra[test,memory]' ./mini > live-evidence/install.log 2>&1
          python -m pip freeze > live-evidence/installed-versions.txt
          git -C hydra status --porcelain > live-evidence/hydra-source-status.txt
          git -C mini status --porcelain > live-evidence/mini-source-status.txt
          curl -fL --retry 2 --max-time 180 https://github.com/ollama/ollama/releases/download/v0.40.1/ollama-linux-amd64.tar.zst -o ollama.tar.zst
          mkdir ollama-local
          tar --zstd -xf ollama.tar.zst -C ollama-local
      - name: Run real model planner, actual worker actions, evidence review and independent grading
        shell: bash
        env:
          TASK_ID: ${{ matrix.task }}
          REPETITION: ${{ matrix.repetition }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/ollama-local/bin:$PATH"
          export OLLAMA_HOST=127.0.0.1:11434
          export OLLAMA_MODELS="$RUNNER_TEMP/ollama-models"
          export OLLAMA_NUM_PARALLEL=1
          export OLLAMA_CONTEXT_LENGTH=16384
          ollama serve > live-evidence/ollama-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:11434/api/version > live-evidence/ollama-version.json && break; sleep 1; done
          timeout 300 ollama pull qwen2.5-coder:3b > live-evidence/model-pull.log 2>&1
          printf 'FROM qwen2.5-coder:3b\nPARAMETER num_ctx 16384\nPARAMETER num_predict 1024\nPARAMETER temperature 0\n' > Modelfile
          ollama create hydra-eval-qwen25coder-3b -f Modelfile > live-evidence/model-create.log 2>&1
          cp Modelfile live-evidence/Modelfile
          python -u run_pair.py "$TASK_ID" "$REPETITION" > live-evidence/run.log 2>&1
          cat live-evidence/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-pair-coder3b-${{ matrix.task }}-${{ matrix.repetition }}
          path: ${{ runner.temp }}/live-evidence
          retention-days: 7
