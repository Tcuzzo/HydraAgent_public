name: ci

on:
  push:
  pull_request:

# Least privilege: every job reads only, unless it widens its own scope below.
permissions:
  contents: read

jobs:
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action comments on PRs when it finds a leak (GITLEAKS_ENABLE_COMMENTS
    # defaults to true), which needs pull-requests: write.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unsafe-code-scan:
    name: unsafe-code scan (no pickle / eval-on-data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: scan for unsafe deserialization / dynamic exec
        run: |
          set -e
          # Anchor on real Python syntax (import statement / attribute call) so that
          # English prose -- e.g. "marshal completion to UI" in a docstring -- cannot
          # trip the guard, while genuinely unsafe code still does. A bare word match
          # cannot tell code from prose; this can.
          mods='pickle|cPickle|dill|marshal|shelve|jsonpickle'
          hits=$(grep -rnE \
            "^[[:space:]]*(import|from)[[:space:]]+([A-Za-z0-9_.]+[[:space:]]*,[[:space:]]*)*($mods)\b|\b($mods)\.[A-Za-z_][A-Za-z0-9_]*\(|yaml\.load\(|allow_pickle|__reduce__|(^|[^.[:alnum:]_])(eval|exec)[[:space:]]*\(" \
            --include='*.py' . \
            | grep -v '/test' \
            | grep -vE '\bdef[[:space:]]+(eval|exec)[[:space:]]*\(' \
            | grep -vE 'yaml\.load\([^)]*SafeLoader' \
            || true)
          if [ -n "$hits" ]; then
            echo "Unsafe deserialization / dynamic-exec patterns found:"; echo "$hits"; exit 1
          fi
          echo "clean: no pickle/unsafe-deserialization/dynamic-exec in shipped code"

  ip-topology-scan:
    name: ip/topology scan (private LAN IP leak)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: scan for private LAN / topology IPs (gitleaks misses IPs)
        run: bash .github/scripts/ip-topology-scan.sh

  smoke:
    name: smoke (${{ matrix.os }} / py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: pip install -e . -c constraints.txt
      - name: import + CLI smoke (cross-platform)
        run: |
          python -m hydra --help
          python -m hydra tools
          python -c "import hydra.cli.cmd_ask, hydra.cli.cmd_chat, hydra.loop, hydra.proc"
      - name: Install and verify Linux sandbox
        if: runner.os == 'Linux'
        run: bash .github/scripts/setup-bwrap.sh
      - name: tests
        run: |
          pip install -e ".[test,mcp]" -c constraints.txt
          pytest -q

  installed-package:
    name: installed package (Ubuntu 24.04 / py${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install and verify sandbox
        run: bash .github/scripts/setup-bwrap.sh
      - name: Build and install a wheel into a fresh environment
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" .
          python -m venv "$RUNNER_TEMP/hydra-installed"
          "$RUNNER_TEMP/hydra-installed/bin/python" -m pip install -c constraints.txt "$RUNNER_TEMP"/wheels/*.whl
          "$RUNNER_TEMP/hydra-installed/bin/python" -m pip check
      - name: Verify installed CLI end to end outside the checkout
        run: |
          "$RUNNER_TEMP/hydra-installed/bin/python" tools/verify_install.py \
            --require-sandbox --output "$RUNNER_TEMP/install-verification.json"
      - name: Preserve installation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-verification-py${{ matrix.python }}
          path: ${{ runner.temp }}/install-verification.json
          if-no-files-found: warn
