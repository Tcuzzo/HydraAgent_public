name: Hydra paired live evaluation
on:
  push:
    branches: [audit/hydra-runtime-20261009]
    paths: [.github/workflows/hydra-paired-live-evaluation.yml]
permissions:
  contents: read
jobs:
  matched-local-worker:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1bca0980838fdc509e97efc1d15267535f19abc4
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned public runtimes without credentials
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/paired-evidence" "$RUNNER_TEMP/ollama-bin"
          git clone --quiet --depth 1 https://github.com/Tcuzzo/HydraAgent_public.git "$RUNNER_TEMP/hydra-source"
          git -C "$RUNNER_TEMP/hydra-source" fetch --quiet --depth 1 origin 33539fcfd12743cdfea076d21674309083758ba2
          git -C "$RUNNER_TEMP/hydra-source" checkout --quiet --detach 33539fcfd12743cdfea076d21674309083758ba2
          git clone --quiet --depth 1 https://github.com/SWE-agent/mini-swe-agent.git "$RUNNER_TEMP/mini-source"
          git -C "$RUNNER_TEMP/mini-source" fetch --quiet --depth 1 origin 04d809ceab9df28f9adaed044884180159172930
          git -C "$RUNNER_TEMP/mini-source" checkout --quiet --detach 04d809ceab9df28f9adaed044884180159172930
          python -m pip install "$RUNNER_TEMP/hydra-source[test,memory]" "$RUNNER_TEMP/mini-source" > "$RUNNER_TEMP/paired-evidence/install.log" 2>&1
          python -m pip freeze > "$RUNNER_TEMP/paired-evidence/versions.txt"
          git -C "$RUNNER_TEMP/hydra-source" rev-parse HEAD > "$RUNNER_TEMP/paired-evidence/hydra-sha.txt"
          git -C "$RUNNER_TEMP/mini-source" rev-parse HEAD > "$RUNNER_TEMP/paired-evidence/mini-sha.txt"
          curl --fail --location --retry 2 --max-time 180 https://github.com/ollama/ollama/releases/download/v0.40.1/ollama-linux-amd64.tar.zst -o "$RUNNER_TEMP/ollama.tar.zst"
          sha256sum "$RUNNER_TEMP/ollama.tar.zst" > "$RUNNER_TEMP/paired-evidence/ollama-archive.sha256"
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/ollama-bin"
          rm "$RUNNER_TEMP/ollama.tar.zst"
          cp -r audit/evaluation_20261009 "$RUNNER_TEMP/paired-evidence/runner"
      - name: Run identical tasks with actual Qwen inference
        env:
          SHARD: ${{ matrix.shard }}
          OLLAMA_HOST: 127.0.0.1:11434
          OLLAMA_NUM_PARALLEL: '1'
          OLLAMA_MAX_LOADED_MODELS: '1'
          OLLAMA_CONTEXT_LENGTH: '32768'
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/ollama-bin/bin:$PATH"
          export OLLAMA_MODELS="$RUNNER_TEMP/local-models"
          ollama serve > "$RUNNER_TEMP/paired-evidence/ollama-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/version > "$RUNNER_TEMP/paired-evidence/ollama-version.json"; then break; fi
            sleep 1
          done
          timeout 240 ollama pull qwen2.5-coder:7b > "$RUNNER_TEMP/paired-evidence/model-pull.log" 2>&1
          ollama show qwen2.5-coder:7b --modelfile > "$RUNNER_TEMP/paired-evidence/model-definition.txt"
          curl -sf http://127.0.0.1:11434/api/tags > "$RUNNER_TEMP/paired-evidence/model-digests.json"
          python audit/evaluation_20261009/run_live.py --shard "$SHARD" --out "$RUNNER_TEMP/paired-evidence/runs" --hydra "$RUNNER_TEMP/hydra-source" --mini "$RUNNER_TEMP/mini-source" > "$RUNNER_TEMP/paired-evidence/run.log" 2>&1
          cat "$RUNNER_TEMP/paired-evidence/run.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydra-paired-live-${{ matrix.shard }}
          path: ${{ runner.temp }}/paired-evidence
          retention-days: 7
