name: bounded console quality recovery

on:
  push:
    branches:
      - ci/console-recovery-20261126

permissions:
  contents: read

jobs:
  console-quality:
    name: exact release tree console quality and mutation gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cdd1f71ac94703c936d88e582a24aaa14f6e3a4b
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e1e58c11356295ba9547bcbcdb75552b46c91761
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install fixed measurement tools and project dependencies
        run: python -m pip install -e "./candidate[test]" -c candidate/constraints.txt coverage==7.17.5 radon==6.0.1
      - name: Measure exact baseline and candidate, then kill three scoped mutants
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python harness/.github/recovery/console_quality.py --candidate candidate --baseline baseline --output "$RUNNER_TEMP/console-quality"
      - name: Preserve complete measurement and failure receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: console-quality-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/console-quality
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
