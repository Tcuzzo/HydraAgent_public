schema: hydra.model_routing.v2
# SINGLE SOURCE OF TRUTH for Hydra's routing policy. Read by hydra/model_routing.py.
#
# OPERATOR LAW (2026-10-23): this file names BACKS rungs only. No model, provider or
# key name lives in Hydra. At call time hydra/rung_resolver.py asks the BACKS rung
# resolver (Kev/Needle) what each rung means right now; BACKS holds the keys and
# picks the live model, and each answer logs its route receipt. To change what a
# role runs on, change the BACKS rungs (fleet_ladder), not this file.
#
# Rungs: plan / work / build / auto are BACKS capability rungs (auto = Kev/Needle
# decide). `task` names the BACKS router task (backs.router.v1) the entry asks for:
# BACKS returns the live rung chain for it, walks it on failure, and learns from each
# outcome. An entry with `local: true` names the BACKS ladder rung for this host's
# local GPU; it is the last resort when BACKS itself is out.
#

roster:
  # Conversation brain: drives chat and calls tools.
  - id: cloud-doer
    rung: work
    task: answer
    role_tags: [chat, conversation, doer, moderate, intent]
  # Strongest reasoning: work turns, audits, verify.
  - id: cloud-planner
    rung: plan
    task: plan
    role_tags: [planner, complex, critical, auditor, verifier, work]
  # Coding / building.
  - id: cloud-build
    rung: build
    task: code
    role_tags: [cloud, code, build, agentic, verify]
  # Kev/Needle pick the rung per task; also the emergency tier between cloud
  # failures and the local GPU.
  - id: cloud-auto
    rung: auto
    task: default
    role_tags: [free, cloud, fallback, chat, web-context]
  # Independent grader: audits work it did not write (router task `grade`).
  - id: cloud-grader
    rung: auto
    task: grade
    role_tags: [auditor, grader, independent]
  # This host's local GPU rung: reads, memory RAG, cheap parallel jobs, last resort.
  - id: local-worker
    rung: local_gpu
    local: true
    role_tags: [worker, local, router, read]

# ── ROUTING RULES: role -> roster id, with a role-owned fallback ladder. ──
routing:
  chat_profiles:
    auto:  cloud-doer
    cloud: cloud-planner
    local: local-worker
  complexity:
    simple:   local-worker  # reads run LOCAL (free) — operator law
    moderate: cloud-doer
    complex:  cloud-planner
    critical: cloud-planner
  roles:
    router:   local-worker
    worker:   local-worker
    doer:     cloud-build
    build:    cloud-build
    coder:    cloud-build
    planner:  cloud-planner
    auditor:  cloud-planner
    research: cloud-planner
    reasoning: cloud-planner
    web_context: cloud-planner
    work:     cloud-planner
    intent:   cloud-doer
    independent_auditor: cloud-grader
  verifier: cloud-planner
  # Role-owned ordered fallbacks; every entry is a rung, resolved at call time.
  fallbacks:
    chat: [cloud-doer, cloud-auto]
    doer: [cloud-build, cloud-doer, cloud-auto]
    build: [cloud-build, cloud-doer, cloud-auto]
    coder: [cloud-build, cloud-doer, cloud-auto]
    planner: [cloud-planner, cloud-doer, cloud-auto]
    reasoning: [cloud-planner, cloud-doer, cloud-auto]
    auditor: [cloud-planner, cloud-build, cloud-doer]
    independent_auditor: [cloud-grader, cloud-auto, cloud-doer]
    research: [cloud-planner, cloud-doer]
    web_context: [cloud-auto, cloud-planner]
